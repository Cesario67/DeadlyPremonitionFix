; DPStabilityFix : configuration
; A placer a cote de DP.exe. 1 = active, 0 = desactive.
; Journaux, diagnostics et copies de secours : dossier DPStabilityFix\ a cote de DP.exe.

[Save]
; Copie de secours de dp.sav au demarrage et avant chaque ecriture/suppression par le jeu.
SaveGuard=1
; Le jeu ecrit dans une copie temporaire qui ne remplace dp.sav qu'une fois l'ecriture terminee :
; un plantage pendant la sauvegarde laisse l'ancien dp.sav intact.
AtomicWrites=1
; Nombre de copies de secours conservees (les plus anciennes sont supprimees).
BackupCount=20
; Chemin de la sauvegarde, relatif au dossier du jeu.
SaveFile=savedata\dp.sav

[Crash]
; Fichier de diagnostic (.dmp) a chaque plantage, a envoyer pour analyse.
CrashDumps=1
; 1 = dump complet (jusqu'a 2 Go, plus d'informations), 0 = dump reduit (~20-30 Mo).
FullMemoryDumps=0
DumpKeepCount=10

[Frames]
; Mesures de cadence d'images, des attentes (Sleep) et de la memoire, ecrites dans le journal.
FrameStats=1
ReportIntervalSeconds=10
; Precision du minuteur Windows demandee pour le jeu, en ms (0 = ne rien changer).
; Le jeu regle sa cadence avec Sleep ; sans cette option, Windows recent peut arrondir ses
; attentes a ~15,6 ms. A comparer : une session a 0, une session a 1.
TimerResolutionMs=1
; Limiteur d'images (0 = desactive). Le jeu avance a la vitesse de l'ecran (120 i/s sur un ecran 120 Hz) ;
; sa physique et certains effets supposent une cadence proche de 60 i/s.
FrameLimitFps=60
; Calcule le temps du jeu en double precision. Sans cela, il perd en finesse a mesure que le PC reste
; allume (~8 ms apres 1 jour, ~65 ms apres 1 semaine ; le demarrage rapide de Windows ne remet pas ce
; compteur a zero). Seules les deux fonctions de temps du jeu sont concernees.
PreciseGameTime=1
; Double precision pour TOUT le jeu (D3DCREATE_FPU_PRESERVE). Deconseille : le jeu a ete concu en
; simple precision, et la double precision empeche la camera de suivre la visee au bord de l'ecran
; (attenue par AimPrecisionGuard). Pour comparaison uniquement.
ForceFpuPreserve=0

[Gameplay]
; Visee restreinte (bug connu du portage PC : le reticule atteint le bord de l'ecran mais la camera
; ne suit plus) : la gestion de la camera de visee est toujours executee en simple precision.
; Mecanisme et correctif decouverts par ZachFix.
AimPrecisionGuard=1

[Graphics]
; DPfix de Durante, integre et corrige (blocage a l'alt-tab, double liberation de surface) :
; resolution, anticrenelage SMAA, SSAO... se reglent dans DPfix.ini. Desactive automatiquement si un
; d3d9.dll externe (DPfix d'origine) est present a cote de DP.exe.
IntegratedDPfix=1

[Controller]
; Manette PlayStation (DualSense, DualShock 4) : presentee au jeu comme une manette Xbox 360, la seule
; disposition qu'il comprend (sinon la camera tourne sans fin et les boutons sont melanges).
SonyLayout=1
; Journalise chaque manette et ses axes quand ils bougent (pour verifier la correspondance des axes).
Diagnostics=1
; Inverse les gachettes L2 / R2 si elles sont echangees en jeu.
SwapTriggers=0
; Le jeu interroge sans cesse des manettes absentes, et Windows refait alors la liste des peripheriques
; toutes les 20 s en bloquant le jeu (~65 ms). Le mod repond a la place de Windows pour ces manettes
; absentes et detecte leur branchement en arriere-plan.
CacheAbsent=1

[Compat]
; Avec DPfix en vrai plein ecran, un alt-tab peut bloquer le jeu (DPfix garde des references qui
; empechent Direct3D de retablir l'affichage). Le mod les fait relacher puis retente.
; Alternative sans risque : borderlessFullscreen 1 dans DPfix.ini.
DPfixResetWorkaround=1

[Debug]
; Journalise toutes les ouvertures de fichiers du jeu (verbeux).
LogAllFileOpens=0
LogKeepCount=10
