name: build

# Chaque push : compilation et tests. Un tag "v*" (par exemple v0.3.0) publie en plus une release en BROUILLON
# avec DPStabilityFix.exe : relire le texte sur GitHub (Releases), puis cliquer sur "Publish release".
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Environnement MSVC hôte x64, cible x86 (DP.exe est 32 bits).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configurer
        run: cmake --preset x86-release

      # Produit la DLL du mod, les .ini et les shaders dans build/x86-release/package.
      - name: Compiler
        run: cmake --build --preset x86-release

      # Launcher C# (Avalonia). Il intègre la DLL, les .ini et les shaders compilés ci-dessus : les joueurs ne
      # téléchargent que DPStabilityFix.exe. msvc-dev-cmd définit Platform=x86 pour la suite du job, et MSBuild
      # rejette alors la solution du launcher ("Release|x86" invalide) : on retire la variable pour ces étapes.
      - name: Tests du launcher
        working-directory: launcher
        run: |
          Remove-Item Env:Platform -ErrorAction SilentlyContinue
          dotnet test -c Release

      - name: Publier le launcher
        run: |
          Remove-Item Env:Platform -ErrorAction SilentlyContinue
          dotnet publish launcher/src/DPStabilityFix.Launcher/DPStabilityFix.Launcher.csproj -c Release -r win-x64 --self-contained -p:DebugType=none -o build/x86-release/package

      # Les runners n'ont ni GPU ni runtime DirectX juin 2010 : tests audio et Direct3D ignorés.
      - name: Tests d'intégration (faux DP.exe)
        shell: powershell
        run: .\tests\run-tests.ps1 -SkipSystemDependent

      # Paquet de développement : launcher (déjà autonome) + DLL + .ini + shaders séparés.
      - uses: actions/upload-artifact@v4
        with:
          name: DPStabilityFix
          path: build/x86-release/package/

      # Symboles, pour analyser les dumps de plantage qui passent par notre DLL.
      - uses: actions/upload-artifact@v4
        with:
          name: DPStabilityFix-symboles
          path: build/x86-release/X3DAudio1_7.pdb

      # Release : seulement pour un tag "v*". Brouillon, à relire avant de publier.
      - name: Créer la release (brouillon)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/x86-release/package/DPStabilityFix.exe build/x86-release/X3DAudio1_7.pdb --draft --prerelease --title "DPStabilityFix ${{ github.ref_name }}" --notes-file .github/release-notes.md --generate-notes
